spring.application.name=cicd-demo
server.port=8080

# Change these two lines to demonstrate an automatic redeployment
app.version=1.0.0
app.message=Deployed automatically by GitHub Actions to Azure Kubernetes Service

# Health endpoints used by the Kubernetes liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

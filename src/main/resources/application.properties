spring.application.name=cicd-demo
server.port=8080
# Finish in-flight requests when Kubernetes stops a pod during a rollout
server.shutdown=graceful

# Change these two lines to demonstrate an automatic redeployment
app.version=1.0.0
app.message=Deployed automatically by GitHub Actions to Azure Kubernetes Service

# Health endpoints used by the Kubernetes liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Kubernetes dashboard. "auto" = on only when running inside a cluster.
dashboard.k8s.enabled=${K8S_DASHBOARD_ENABLED:auto}
dashboard.max-replicas=5
# Optional: when set, scale/restart/delete need this token (sent as X-Dashboard-Token)
dashboard.token=${DASHBOARD_TOKEN:}

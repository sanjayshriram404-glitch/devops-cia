<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CI/CD Demo</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; background: #f4f6fb; margin: 0; color: #1d2333; }
        .card { max-width: 640px; margin: 64px auto; background: #fff; border-radius: 12px; padding: 32px 40px;
                box-shadow: 0 4px 18px rgba(0,0,0,.08); }
        h1 { margin-top: 0; color: #0b5cad; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        td { padding: 8px 4px; border-bottom: 1px solid #e5e8ef; }
        td:first-child { font-weight: 600; width: 40%; }
        .badge { display: inline-block; background: #0b5cad; color: #fff; padding: 2px 10px; border-radius: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h1>CI/CD Demo Application</h1>
    <p th:text="${info.message}">message</p>
    <table>
        <tr><td>Version</td><td><span class="badge" th:text="${info.version}">1.0.0</span></td></tr>
        <tr><td>Git commit</td><td th:text="${info.buildSha}">sha</td></tr>
        <tr><td>Served by pod</td><td th:text="${info.podName}">pod</td></tr>
        <tr><td>Pipeline</td><td>Git &rarr; Maven &rarr; Docker &rarr; ACR &rarr; Ansible &rarr; AKS</td></tr>
    </table>
</div>
</body>
</html>
